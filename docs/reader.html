<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leseansicht – Nachlass Jeanne Hersch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/edition.css">
</head>
<body class="edition-page">

    <a href="#main-content" class="ed-skip-nav">Zum Inhalt springen</a>
    <nav class="ed-nav" id="ed-nav-slot" role="navigation" aria-label="Hauptnavigation"></nav>

    <main id="main-content" class="ed-reader">
        <!-- Compact Header: Title + Key Metadata -->
        <div class="ed-reader-header">
            <div class="ed-reader-header-left">
                <a href="catalog.html" class="ed-back-link" title="Zurueck zum Katalog">&larr;</a>
                <h1 class="ed-reader-title">Lade...</h1>
            </div>
            <div class="ed-reader-meta" id="reader-meta"></div>
        </div>

        <!-- Edit toolbar (only visible when server running) -->
        <div class="ed-edit-toolbar ed-hidden" id="edit-toolbar">
            <button class="ed-toolbar-btn" id="edit-toggle" title="Bearbeitungsmodus">Bearbeiten</button>
            <button class="ed-toolbar-btn ed-btn-save ed-edit-only" id="save-btn" title="Speichern (Ctrl+S)" disabled>Speichern</button>
            <button class="ed-toolbar-btn ed-edit-only" id="validate-btn" title="TEI validieren">Validieren</button>
            <span class="ed-save-status ed-edit-only" id="save-status"></span>
        </div>

        <!-- Panels -->
        <div class="ed-reader-panels">
            <!-- Faksimile Panel with integrated controls -->
            <div class="ed-panel-faksimile" id="faks-panel">
                <div class="ed-faks-viewport" id="faks-viewport">
                    <div class="ed-empty-state">Bild wird geladen...</div>
                </div>
                <!-- Viewer controls overlay (bottom of faksimile panel) -->
                <div class="ed-faks-controls">
                    <div class="ed-faks-pages" id="page-thumbs"></div>
                    <div class="ed-faks-toolbar">
                        <button class="ed-faks-btn" id="page-prev" disabled title="Vorherige Seite">&larr;</button>
                        <span class="ed-faks-indicator" id="page-indicator">1 / 1</span>
                        <button class="ed-faks-btn" id="page-next" disabled title="Naechste Seite">&rarr;</button>
                        <span class="ed-faks-sep"></span>
                        <button class="ed-faks-btn" id="zoom-out" title="Verkleinern">&minus;</button>
                        <span class="ed-faks-indicator" id="zoom-label">100%</span>
                        <button class="ed-faks-btn" id="zoom-in" title="Vergroessern">+</button>
                        <button class="ed-faks-btn" id="zoom-fit" title="An Breite anpassen">&#x2194;</button>
                        <button class="ed-faks-btn" id="zoom-reset" title="Originalgroesse">1:1</button>
                        <button class="ed-faks-btn" id="rotate-btn" title="Drehen">&#x21BB;</button>
                    </div>
                </div>
            </div>

            <div class="ed-panel-divider" title="Ziehen zum Anpassen"></div>

            <!-- Text Panel -->
            <div class="ed-panel-text ed-tei-serif">
                <div class="ed-text-view-toggle">
                    <button class="ed-view-tab active" id="view-text" title="Leseansicht">Text</button>
                    <button class="ed-view-tab" id="view-xml" title="XML-Quellansicht">XML</button>
                </div>
                <div class="ed-text-content">
                    <div class="ed-skeleton ed-skeleton-block" style="height:400px"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/edition-shared.js"></script>
    <script src="entity-utils.js"></script>
    <script src="js/edition-tei.js"></script>
    <script src="js/edition-editor.js"></script>
    <script src="js/edition-reader.js"></script>
</body>
</html>
