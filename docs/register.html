<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Nachlass Jeanne Hersch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/edition.css">
</head>
<body class="edition-page">

    <a href="#main-content" class="ed-skip-nav">Zum Inhalt springen</a>
    <nav class="ed-nav" id="ed-nav-slot" role="navigation" aria-label="Hauptnavigation"></nav>

    <main id="main-content" class="ed-section">
        <div class="ed-section-inner">
            <h1 class="ed-section-title">Entity-Register</h1>
            <div id="register-type-stats" class="ed-register-stats"></div>

            <!-- Type Tabs -->
            <div class="ed-register-tabs" id="register-tabs" role="tablist">
                <button class="ed-register-tab active" data-type="person" role="tab" aria-selected="true">
                    Personen <span class="ed-register-tab-count" id="tab-count-person"></span>
                </button>
                <button class="ed-register-tab" data-type="organization" role="tab" aria-selected="false">
                    Organisationen <span class="ed-register-tab-count" id="tab-count-organization"></span>
                </button>
                <button class="ed-register-tab" data-type="place" role="tab" aria-selected="false">
                    Orte <span class="ed-register-tab-count" id="tab-count-place"></span>
                </button>
                <button class="ed-register-tab" data-type="work" role="tab" aria-selected="false">
                    Werke <span class="ed-register-tab-count" id="tab-count-work"></span>
                </button>
            </div>

            <div class="ed-catalog-layout">
                <!-- Sidebar: search + filters -->
                <aside class="ed-sidebar" aria-label="Filter">
                    <h2>Suche</h2>
                    <input type="search" class="ed-search-input" id="register-search"
                           placeholder="Name, Variante, ID..." aria-label="Suche im Register">

                    <h2>Verknuepfung</h2>
                    <div class="ed-filter-group" id="filter-resolution">
                        <label class="ed-filter-label"><input type="checkbox" name="resolution" value="wikidata"> Mit Wikidata</label>
                        <label class="ed-filter-label"><input type="checkbox" name="resolution" value="gnd"> Mit GND</label>
                        <label class="ed-filter-label"><input type="checkbox" name="resolution" value="none"> Ohne Link</label>
                    </div>

                    <h2>Vorkommen</h2>
                    <div class="ed-filter-group" id="filter-occurrence">
                        <label class="ed-filter-label"><input type="checkbox" name="occurrence" value="with_docs"> In Dokumenten</label>
                        <label class="ed-filter-label"><input type="checkbox" name="occurrence" value="without_docs"> Ohne Dokumente</label>
                    </div>
                </aside>

                <!-- Main content area -->
                <div>
                    <div class="ed-catalog-header">
                        <span class="ed-result-count" id="result-count" aria-live="polite" aria-atomic="true">Lade...</span>
                        <div class="ed-toolbar-row">
                            <div class="ed-view-toggle" role="group" aria-label="Ansicht wechseln">
                                <button class="ed-view-btn active" data-view="table" aria-pressed="true">Tabelle</button>
                                <button class="ed-view-btn" data-view="cards" aria-pressed="false">Karten</button>
                            </div>
                            <select class="ed-sort-select" id="register-sort" aria-label="Sortierung">
                                <option value="name">Name A-Z</option>
                                <option value="-name">Name Z-A</option>
                                <option value="-doc_count">Dokumente abst.</option>
                                <option value="-mention_count">Erwaehnungen abst.</option>
                                <option value="id">ID aufst.</option>
                            </select>
                        </div>
                    </div>

                    <div id="register-results">
                        <div class="ed-skeleton ed-skeleton-block" style="height:400px"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="ed-footer" id="ed-footer-slot"></footer>

    <script src="js/zbz-core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@6.3.0/dist/umd/index.min.js"></script>
    <script src="js/edition-shared.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
