<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Nachlass Jeanne Hersch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/edition.css">
</head>
<body class="edition-page">

    <a href="#main-content" class="ed-skip-nav">Zum Inhalt springen</a>

    <nav class="ed-nav" id="ed-nav-slot" role="navigation" aria-label="Hauptnavigation"></nav>

    <main id="main-content" class="ed-section">
        <div class="ed-section-inner">
            <h1 class="ed-section-title">Register</h1>

            <!-- Type Tabs -->
            <div class="ed-register-tabs" id="register-tabs" role="tablist" aria-label="Entitaetstypen"></div>
            <div id="register-type-stats" style="font-size:var(--ed-text-xs);color:var(--ed-text-muted);margin-bottom:var(--ed-space-md)"></div>

            <div class="ed-catalog-layout">
                <!-- Sidebar: search + filters -->
                <aside class="ed-sidebar" aria-label="Filter">
                    <h3>Suche</h3>
                    <input type="search" class="ed-search-input" id="register-search"
                           placeholder="Name, Variante, ID..." aria-label="Suche im Register">

                    <h3>Verknuepfung</h3>
                    <div class="ed-filter-group" id="filter-resolution"></div>

                    <h3>Vorkommen</h3>
                    <div class="ed-filter-group" id="filter-occurrence"></div>
                </aside>

                <!-- Main content area -->
                <div>
                    <div class="ed-catalog-header">
                        <span class="ed-result-count" id="result-count">Lade...</span>
                        <div style="display:flex;gap:var(--ed-space-sm);align-items:center">
                            <div class="ed-view-toggle">
                                <button class="ed-view-btn active" data-view="table">Tabelle</button>
                                <button class="ed-view-btn" data-view="cards">Karten</button>
                            </div>
                            <select class="ed-sort-select" id="register-sort" aria-label="Sortierung">
                                <option value="name">Name A–Z</option>
                                <option value="-name">Name Z–A</option>
                                <option value="-doc_count">Dokumente abst.</option>
                                <option value="-mention_count">Erwaehnungen abst.</option>
                                <option value="id">ID aufst.</option>
                            </select>
                        </div>
                    </div>

                    <div id="register-results">
                        <div class="ed-skeleton ed-skeleton-block" style="height:400px"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="ed-footer" id="ed-footer-slot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/minisearch@6.3.0/dist/umd/index.min.js"></script>
    <script src="js/edition-shared.js"></script>
    <script src="js/edition-register.js"></script>
</body>
</html>
