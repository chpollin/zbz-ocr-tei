<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZBZ OCR Pipeline - Jeanne Hersch Edition</title>
    <link rel="stylesheet" href="shared.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>ZBZ OCR Pipeline <span class="subtitle">Jeanne Hersch Edition</span></h1>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">Dashboard</a>
                <a href="viewer.html?doc=2310">Viewer</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="loading">Lade Dashboard-Daten...</div>
        <div id="app" style="display:none">

            <!-- A) Dashboard-Metriken -->
            <div class="metric-grid" id="metrics"></div>

            <!-- B) Phasen-Uebersicht -->
            <div class="section-title">CER nach Testphase</div>
            <div class="section-subtitle">Mistral OCR &#8594; LLM-korrigiert (Claude Haiku 4.5, Variante C)</div>
            <div id="phase-summary"></div>

            <!-- C) Dokumentkatalog -->
            <div class="section-title" style="margin-top:2.5rem">Dokumentkatalog</div>
            <div class="filter-bar" id="filters">
                <input type="text" class="filter-input" id="filter-search" placeholder="Dokument suchen...">
                <select class="filter-select" id="filter-type">
                    <option value="">Alle Typen</option>
                    <option value="A">Typ A - Einspaltig</option>
                    <option value="B">Typ B - Zweispaltig</option>
                    <option value="C">Typ C - Monografie</option>
                    <option value="D">Typ D - Spezial</option>
                    <option value="-">Nicht klassifiziert</option>
                </select>
                <select class="filter-select" id="filter-status">
                    <option value="">Alle Status</option>
                    <option value="pilot">Pilot-Docs</option>
                    <option value="complete">Pipeline komplett</option>
                    <option value="partial">In Bearbeitung</option>
                    <option value="pending">Ausstehend</option>
                </select>
                <select class="filter-select" id="filter-engine">
                    <option value="">Alle Engines</option>
                    <option value="mistral">Mistral</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="llm">LLM-korrigiert</option>
                </select>
            </div>
            <div id="doc-catalog"></div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
