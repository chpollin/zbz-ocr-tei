<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hersch Pipeline-Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=3">
  <link rel="stylesheet" href="css/base.css?v=3">
  <link rel="stylesheet" href="css/viewer.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js"></script>
</head>
<body class="viewer-body">

  <!-- ============================================================ Site-Header (shared) ============================================================ -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="index.html" title="Zurueck zur Korpus-Uebersicht">
        <strong>Hersch</strong>
        <span>Pipeline</span>
      </a>
      <p class="site-header__sub">Pipeline-Viewer fuer ein einzelnes Dokument</p>
      <nav class="site-header__nav" aria-label="Hauptnavigation">
        <a href="index.html">Korpus</a>
        <a href="about.html">About</a>
        <a href="https://github.com/DHCraft/zbz-ocr-tei" target="_blank" rel="noopener">Repo</a>
      </nav>
    </div>
  </header>

  <div class="app">

    <!-- ============================================================ Doc-Subbar (Meta + Downloads) ============================================================ -->
    <div class="doc-subbar" id="doc-subbar" hidden>
      <div class="doc-subbar__inner">
        <div class="doc-subbar__meta" id="doc-meta" aria-live="polite"></div>
        <div class="doc-subbar__actions">
          <button class="btn btn--sm" id="btn-download-layout"  title="Layout-JSON herunterladen" disabled>Layout &darr;</button>
          <button class="btn btn--sm" id="btn-download-text"    title="Transkription herunterladen" disabled>Text &darr;</button>
          <button class="btn btn--sm" id="btn-download-tei"     title="TEI-XML herunterladen" disabled>TEI &darr;</button>
        </div>
      </div>
    </div>

    <!-- ============================================================ Main: Toolbar + Panels ============================================================ -->
    <main class="main" id="main">

      <!-- Toolbar: Seitennav + Modus -->
      <div class="toolbar">
        <div class="toolbar__inner">
          <div class="toolbar__group" role="group" aria-label="Seitennavigation">
            <button class="btn btn--sm btn--icon" id="btn-prev" title="Vorherige Seite (Pfeil links)" disabled>&blacktriangleleft;</button>
            <span class="page-info" id="page-info">— / —</span>
            <button class="btn btn--sm btn--icon" id="btn-next" title="Naechste Seite (Pfeil rechts)" disabled>&blacktriangleright;</button>
          </div>

          <div class="toolbar__divider"></div>

          <div class="toolbar__group" role="group" aria-label="OCR-Quelle">
            <label class="toolbar__label" for="ocr-source">OCR</label>
            <select class="input toolbar__select" id="ocr-source">
              <option value="mistral">Mistral</option>
              <option value="gemini_corrected_a">Gemini A</option>
              <option value="gemini_corrected_b">Gemini B</option>
              <option value="llm_corrected">LLM (Haiku)</option>
              <option value="deepseek">DeepSeek</option>
            </select>
          </div>

          <div class="toolbar__mode" role="group" aria-label="Ansichts-Modus">
            <button class="mode-btn" data-mode="view"   aria-pressed="true"  title="Nur ansehen">Anzeigen</button>
            <button class="mode-btn" data-mode="layout" aria-pressed="false" title="Layout-Regionen bearbeiten">Layout</button>
            <button class="mode-btn" data-mode="text"   aria-pressed="false" title="Transkription bearbeiten">Transkription</button>
          </div>
        </div>
      </div>

      <!-- Layout-Editor-Toolbar (nur im Layout-Modus sichtbar) -->
      <div class="editor-toolbar hidden" id="layout-toolbar" aria-label="Layout-Editor-Werkzeuge">
        <div class="editor-toolbar__group">
          <button class="btn btn--sm" id="btn-region-add"    title="Region hinzufuegen">+ Region</button>
          <button class="btn btn--sm" id="btn-region-delete" title="Selektierte Region loeschen (Entf)" disabled>Loeschen</button>
        </div>
        <div class="toolbar__divider"></div>
        <div class="editor-toolbar__group" id="region-type-selector">
          <label class="toolbar__label" for="region-type">Typ</label>
          <select class="input toolbar__select" id="region-type" disabled>
            <option value="zb_heading">Heading</option>
            <option value="zb_paragraph">Paragraph</option>
            <option value="footnote">Fussnote</option>
            <option value="caption">Caption</option>
            <option value="_filter">Filter</option>
            <option value="_skip">Skip</option>
          </select>
        </div>
        <span class="editor-toolbar__hint">Klick selektiert &middot; Ecke zieht skaliert &middot; Drag-and-Drop ordnet Reading-Order</span>
      </div>

      <!-- Panels: Faksimile (links) + Text (rechts) -->
      <div class="panels" id="panels">

        <section class="panel panel--facsimile" id="panel-image" aria-label="Faksimile mit Layout-Overlay">
          <div class="panel__header">
            <span class="panel__title">Faksimile</span>
            <span class="panel__hint" id="region-count"></span>
          </div>
          <div class="panel__body" id="image-body">
            <div class="empty">Kein Dokument geladen</div>
          </div>
        </section>

        <div class="panel__divider" id="divider" aria-hidden="true"></div>

        <section class="panel panel--text" id="panel-text" aria-label="Transkription + TEI">
          <div class="panel__header">
            <span class="panel__title" id="text-panel-title">Transkription</span>
            <div role="group" aria-label="Text-Quelle" class="toolbar__mode toolbar__mode--inline">
              <button class="mode-btn" data-text-source="ocr" aria-pressed="true"  title="OCR-Rohtext">OCR</button>
              <button class="mode-btn" data-text-source="tei" aria-pressed="false" title="TEI gerendert">TEI</button>
              <button class="mode-btn" data-text-source="xml" aria-pressed="false" title="TEI als XML-Quelle">XML</button>
            </div>
          </div>
          <div class="panel__body panel__body--paper" id="text-body">
            <div class="empty">Kein Dokument geladen</div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script src="js/core.js"></script>
  <script src="js/tei-render.js"></script>
  <script src="js/download.js"></script>
  <script src="js/layout-editor.js"></script>
  <script src="js/transcription-editor.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
