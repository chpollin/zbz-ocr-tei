<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Benchmark - Jeanne Hersch Edition</title>
    <style>
        :root {
            --bg: #fafaf9;
            --bg-card: #ffffff;
            --bg-subtle: #f5f5f4;
            --bg-muted: #e7e5e4;
            --border: #d6d3d1;
            --border-light: #e7e5e4;
            --text: #1c1917;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --accent-a: #0f766e;      /* teal - Mistral */
            --accent-a-light: #ccfbf1;
            --accent-a-bg: #f0fdfa;
            --accent-b: #7c3aed;      /* violet - DeepSeek */
            --accent-b-light: #ede9fe;
            --accent-b-bg: #f5f3ff;
            --warm: #b45309;
            --warm-light: #fef3c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        header .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-left: 0.75rem;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .nav-links a:hover { color: var(--text); }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Info Banner */
        .info-banner {
            background: var(--warm-light);
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 0.875rem 1.25rem;
            margin-bottom: 2rem;
            font-size: 0.85rem;
            color: var(--warm);
            line-height: 1.6;
        }

        /* Metric Grid */
        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .metric {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 1.25rem;
        }
        .metric .label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .metric .value {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }
        .metric .detail {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .metric .value .teal { color: var(--accent-a); }
        .metric .value .violet { color: var(--accent-b); }
        .metric .value .dim { color: var(--text-muted); font-weight: 400; font-size: 1.1rem; }

        /* Section Title */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }

        /* Document Card */
        .doc-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .doc-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

        .doc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem 1.25rem;
            cursor: pointer;
            user-select: none;
        }
        .doc-header:hover { background: var(--bg-subtle); }
        .doc-title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .doc-tags {
            display: flex;
            gap: 0.375rem;
            align-items: center;
        }
        .tag {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-muted);
            color: var(--text-secondary);
        }
        .chevron {
            transition: transform 0.2s;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
        .doc-card.open .chevron { transform: rotate(180deg); }

        .doc-body {
            display: none;
            border-top: 1px solid var(--border-light);
        }
        .doc-card.open .doc-body { display: block; }

        /* Stats Comparison */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--border-light);
        }
        .stats-panel {
            padding: 1rem 1.25rem;
        }
        .stats-panel:first-child {
            border-right: 1px solid var(--border-light);
        }
        .stats-panel h4 {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.625rem;
        }
        .stats-panel h4.teal { color: var(--accent-a); }
        .stats-panel h4.violet { color: var(--accent-b); }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 0.2rem 0;
            font-size: 0.825rem;
        }
        .stat-row .sl { color: var(--text-muted); }
        .stat-row .sv { font-weight: 500; }

        /* Bar */
        .bar-wrap {
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
        }
        .bar-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.375rem;
        }
        .bar {
            display: flex;
            height: 24px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-muted);
        }
        .bar-seg {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 600;
            color: white;
            min-width: 50px;
            transition: width 0.4s ease;
        }
        .bar-seg.teal { background: var(--accent-a); }
        .bar-seg.violet { background: var(--accent-b); }
        .bar-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Page Nav */
        .page-nav {
            padding: 0.75rem 1.25rem;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 0.375rem;
            flex-wrap: wrap;
        }
        .page-nav .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 0.25rem;
        }
        .pg {
            width: 30px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .pg:hover { border-color: var(--accent-a); color: var(--accent-a); }
        .pg.active {
            background: var(--accent-a);
            border-color: var(--accent-a);
            color: white;
        }
        .pg.both { border-bottom: 2px solid var(--accent-b); }
        .page-nav .hint {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-left: auto;
        }
        .hint-dot {
            display: inline-block;
            width: 8px;
            height: 3px;
            border-radius: 1px;
            vertical-align: middle;
            margin-right: 3px;
        }
        .hint-dot.violet { background: var(--accent-b); }

        /* Three Column Preview */
        .preview {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .preview-col {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-light);
            min-height: 300px;
        }
        .preview-col:last-child { border-right: none; }
        .preview-col-header {
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-light);
            text-align: center;
            color: var(--text-secondary);
        }
        .preview-col-header.teal { color: var(--accent-a); background: var(--accent-a-bg); }
        .preview-col-header.violet { color: var(--accent-b); background: var(--accent-b-bg); }
        .preview-col-body {
            flex: 1;
            overflow: auto;
            padding: 0.75rem;
            max-height: 650px;
        }
        .preview-col-body img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--border-light);
            cursor: zoom-in;
        }
        .preview-col-body pre {
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.78rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text);
        }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            cursor: zoom-out;
            padding: 2rem;
            overflow: auto;
        }
        .overlay.active { display: flex; align-items: flex-start; justify-content: center; }
        .overlay img { max-width: 90%; max-height: 95vh; }

        /* Responsive */
        @media (max-width: 1100px) {
            .metrics { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 900px) {
            .preview { grid-template-columns: 1fr; }
            .preview-col { border-right: none; border-bottom: 1px solid var(--border-light); }
            .preview-col-body { max-height: 400px; }
            .stats-grid { grid-template-columns: 1fr; }
            .stats-panel:first-child { border-right: none; border-bottom: 1px solid var(--border-light); }
            .metrics { grid-template-columns: 1fr; }
            .header-inner { flex-direction: column; }
        }

        #loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>OCR Benchmark <span class="subtitle">Jeanne Hersch Edition -- Phase 1</span></h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Dokumentliste</a>
                <a href="viewer.html?doc=2310">Viewer</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="loading">Lade Benchmark-Daten...</div>
        <div id="app" style="display:none">
            <div id="info-banner"></div>
            <div class="metrics" id="metrics"></div>
            <div class="section-title">Dokument-Vergleich</div>
            <div id="doc-list"></div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="this.classList.remove('active')">
        <img id="overlay-img" src="" alt="Zoom">
    </div>

    <script>
    const DATA = {
        timestamp: "2026-02-18",
        documents: [
            {
                id: "2310", desc: "Rezension (Karl Jaspers, Philosophie)",
                type: "A", lang: "FR", totalPages: 3,
                mistral: { pages: 3, chars: 8041, time: 5.6, spp: 1.87 },
                deepseek: { pages: 2, chars: 6597, available: [2, 3] }
            },
            {
                id: "1180", desc: "Jahresbericht SAGW 1975",
                type: "A", lang: "DE/FR", totalPages: 8,
                mistral: { pages: 8, chars: 20121, time: 6.37, spp: 0.8 },
                deepseek: { pages: 2, chars: 6070, available: [2, 3] }
            },
            {
                id: "290", desc: "L'Oeuvre de Karl Jaspers",
                type: "A", lang: "FR", totalPages: 5,
                mistral: { pages: 5, chars: 15148, time: 6.34, spp: 1.27 },
                deepseek: { pages: 2, chars: 5213, available: [1, 2] }
            }
        ]
    };

    const fmt = n => n.toLocaleString('de-DE');
    const sum = (arr, fn) => arr.reduce((s, d) => s + fn(d), 0);

    function init() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        renderBanner();
        renderMetrics();
        renderDocs();
    }

    function renderBanner() {
        document.getElementById('info-banner').innerHTML = `
            <div class="info-banner">
                <strong>Hinweis:</strong> DeepSeek wurde lokal (GPU) getestet und hat nur 2 Seiten pro Dokument verarbeitet.
                Mistral laeuft serverseitig und verarbeitet alle Seiten. Die Gesamtzeichenzahlen sind daher nicht direkt vergleichbar.
                Waehle unten Seiten mit <span class="hint-dot violet" style="display:inline-block;width:12px;height:3px;background:var(--accent-b);vertical-align:middle;border-radius:1px;"></span> violettem Rand,
                um beide Engines auf derselben Seite zu vergleichen.
            </div>
        `;
    }

    function renderMetrics() {
        const d = DATA.documents;
        const mPages = sum(d, x => x.mistral.pages);
        const dPages = sum(d, x => x.deepseek.pages);
        const avgSpp = (sum(d, x => x.mistral.spp) / d.length).toFixed(1);
        const totalTime = sum(d, x => x.mistral.time).toFixed(1);

        document.getElementById('metrics').innerHTML = `
            <div class="metric">
                <div class="label">Getestete Dokumente</div>
                <div class="value">${d.length} <span class="dim">/ 15</span></div>
                <div class="detail">Phase 1 -- alle Typ A</div>
            </div>
            <div class="metric">
                <div class="label">Seitenabdeckung</div>
                <div class="value"><span class="teal">${mPages}</span> <span class="dim">vs</span> <span class="violet">${dPages}</span></div>
                <div class="detail">Mistral alle Seiten, DeepSeek je 2</div>
            </div>
            <div class="metric">
                <div class="label">Mistral Geschwindigkeit</div>
                <div class="value"><span class="teal">${avgSpp}s</span> <span class="dim">/ Seite</span></div>
                <div class="detail">${totalTime}s gesamt (Cloud-API, kein GPU)</div>
            </div>
            <div class="metric">
                <div class="label">DeepSeek Modus</div>
                <div class="value"><span class="violet">Lokal</span></div>
                <div class="detail">GPU, keine Zeitmessung verfuegbar</div>
            </div>
        `;
    }

    function renderDocs() {
        const container = document.getElementById('doc-list');

        DATA.documents.forEach((doc, idx) => {
            const mPct = (doc.mistral.chars / (doc.mistral.chars + doc.deepseek.chars) * 100).toFixed(1);
            const dPct = (100 - parseFloat(mPct)).toFixed(1);
            const sharedStr = doc.deepseek.available.join(', ');

            // Page buttons
            let pageBtns = '';
            for (let p = 1; p <= doc.totalPages; p++) {
                const both = doc.deepseek.available.includes(p);
                const isStart = (p === doc.deepseek.available[0]);
                pageBtns += `<button class="pg ${both ? 'both' : ''} ${isStart ? 'active' : ''}" onclick="showPage('${doc.id}',${p},this)">${p}</button>`;
            }

            const card = document.createElement('div');
            card.className = 'doc-card' + (idx === 0 ? ' open' : '');
            card.innerHTML = `
                <div class="doc-header" onclick="this.parentElement.classList.toggle('open')">
                    <span class="doc-title">${doc.id}.pdf -- ${doc.desc}</span>
                    <div class="doc-tags">
                        <span class="tag">Typ ${doc.type}</span>
                        <span class="tag">${doc.lang}</span>
                        <span class="tag">${doc.totalPages} S.</span>
                        <span class="chevron">&#9662;</span>
                    </div>
                </div>
                <div class="doc-body">
                    <div class="stats-grid">
                        <div class="stats-panel">
                            <h4 class="teal">Mistral Document AI 2512</h4>
                            <div class="stat-row"><span class="sl">Seiten</span><span class="sv">${doc.mistral.pages} / ${doc.totalPages}</span></div>
                            <div class="stat-row"><span class="sl">Zeichen</span><span class="sv">${fmt(doc.mistral.chars)}</span></div>
                            <div class="stat-row"><span class="sl">Zeit</span><span class="sv">${doc.mistral.time}s (${doc.mistral.spp}s/S.)</span></div>
                        </div>
                        <div class="stats-panel">
                            <h4 class="violet">DeepSeek-OCR-2</h4>
                            <div class="stat-row"><span class="sl">Seiten</span><span class="sv">${doc.deepseek.pages} / ${doc.totalPages}</span></div>
                            <div class="stat-row"><span class="sl">Zeichen</span><span class="sv">${fmt(doc.deepseek.chars)}</span></div>
                            <div class="stat-row"><span class="sl">Vorhanden</span><span class="sv">S. ${sharedStr}</span></div>
                        </div>
                    </div>
                    <div class="bar-wrap">
                        <div class="bar-label">Zeichenvergleich (unterschiedliche Seitenzahl)</div>
                        <div class="bar">
                            <div class="bar-seg teal" style="width:${mPct}%">${fmt(doc.mistral.chars)}</div>
                            <div class="bar-seg violet" style="width:${dPct}%">${fmt(doc.deepseek.chars)}</div>
                        </div>
                        <div class="bar-footer">
                            <span>Mistral (${doc.mistral.pages} S.)</span>
                            <span>DeepSeek (${doc.deepseek.pages} S.)</span>
                        </div>
                    </div>
                    <div class="page-nav" data-doc="${doc.id}">
                        <span class="label">Seite</span>
                        ${pageBtns}
                        <span class="hint"><span class="hint-dot violet"></span> beide Engines</span>
                    </div>
                    <div class="preview" id="pv-${doc.id}">
                        <div class="preview-col">
                            <div class="preview-col-header">Faksimile</div>
                            <div class="preview-col-body" id="img-${doc.id}">
                                <img src="" alt="Scan" id="img-el-${doc.id}" onclick="zoom(this.src)">
                            </div>
                        </div>
                        <div class="preview-col">
                            <div class="preview-col-header teal">Mistral OCR</div>
                            <div class="preview-col-body"><pre id="mt-${doc.id}"></pre></div>
                        </div>
                        <div class="preview-col">
                            <div class="preview-col-header violet">DeepSeek OCR</div>
                            <div class="preview-col-body"><pre id="dt-${doc.id}"></pre></div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);

            showPage(doc.id, doc.deepseek.available[0]);
        });
    }

    async function fetchText(path) {
        try {
            const r = await fetch(path);
            if (r.ok) return await r.text();
        } catch(e) {}
        return null;
    }

    async function showPage(docId, page, btn) {
        if (btn) {
            btn.closest('.page-nav').querySelectorAll('.pg').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const pp = String(page).padStart(3, '0');
        document.getElementById(`img-el-${docId}`).src = `images/${docId}/${docId}_p${pp}.png`;

        const mt = await fetchText(`../output/mistral_results/${docId}_p${page}.md`);
        const mEl = document.getElementById(`mt-${docId}`);
        mEl.textContent = mt || '';
        if (!mt) mEl.innerHTML = '<div class="empty-state">Keine Daten</div>';

        const dt = await fetchText(`../output/ocr_results/${docId}_p${page}.md`);
        const dEl = document.getElementById(`dt-${docId}`);
        dEl.textContent = dt || '';
        if (!dt) dEl.innerHTML = '<div class="empty-state">Seite nicht verarbeitet</div>';
    }

    function zoom(src) {
        document.getElementById('overlay-img').src = src;
        document.getElementById('overlay').classList.add('active');
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') document.getElementById('overlay').classList.remove('active');
    });

    init();
    </script>
</body>
</html>
