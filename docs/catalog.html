<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentkatalog – Nachlass Jeanne Hersch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/edition.css">
</head>
<body class="edition-page">

    <a href="#main-content" class="ed-skip-nav">Zum Inhalt springen</a>

    <nav class="ed-nav" id="ed-nav-slot" role="navigation" aria-label="Hauptnavigation"></nav>

    <main id="main-content" class="ed-section">
        <div class="ed-section-inner">
            <h1 class="ed-section-title">Dokumentkatalog</h1>

            <div class="ed-catalog-layout">
                <!-- Sidebar Filters -->
                <aside class="ed-sidebar" aria-label="Filter">
                    <h3>Suche</h3>
                    <input type="search" class="ed-search-input" id="catalog-search" placeholder="Titel, Autor, ID..." aria-label="Volltextsuche">

                    <h3>Dokumenttyp</h3>
                    <div class="ed-filter-group" id="filter-types"></div>

                    <h3>Sprache</h3>
                    <div class="ed-filter-group" id="filter-langs"></div>

                    <h3>Publikationsform</h3>
                    <div class="ed-filter-group" id="filter-forms"></div>

                    <h3>Screening-Status</h3>
                    <div class="ed-filter-group" id="filter-screening"></div>

                    <h3>Zeitraum</h3>
                    <div class="ed-date-range">
                        <input type="text" class="ed-date-input" id="filter-date-from" placeholder="Von" aria-label="Datum von">
                        <span>–</span>
                        <input type="text" class="ed-date-input" id="filter-date-to" placeholder="Bis" aria-label="Datum bis">
                    </div>
                </aside>

                <!-- Main Content -->
                <div>
                    <div class="ed-catalog-header">
                        <span class="ed-result-count" id="result-count">Lade...</span>
                        <div class="ed-toolbar-row">
                            <div class="ed-view-toggle">
                                <button class="ed-view-btn active" data-view="table">Tabelle</button>
                                <button class="ed-view-btn" data-view="cards">Karten</button>
                                <button class="ed-view-btn" data-view="gallery">Galerie</button>
                            </div>
                            <select class="ed-sort-select" id="catalog-sort" aria-label="Sortierung">
                                <option value="id">ID aufsteigend</option>
                                <option value="-id">ID absteigend</option>
                                <option value="title">Titel A-Z</option>
                                <option value="-title">Titel Z-A</option>
                                <option value="author">Autor A-Z</option>
                                <option value="date">Datum aufsteigend</option>
                                <option value="-date">Datum absteigend</option>
                                <option value="-pages">Seiten absteigend</option>
                                <option value="screening">Screening-Status</option>
                            </select>
                        </div>
                    </div>

                    <div id="catalog-results">
                        <div class="ed-skeleton ed-skeleton-block" style="height:400px"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="ed-footer" id="ed-footer-slot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/minisearch@6.3.0/dist/umd/index.min.js"></script>
    <script src="js/edition-shared.js"></script>
    <script src="js/edition-catalog.js"></script>
</body>
</html>
