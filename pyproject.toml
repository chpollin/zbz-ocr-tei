# No [build-system]: this repo is a dependency set and script pipeline, not a package.

[project]
name = "zbz-ocr-tei"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",     # .env -> env vars (scripts/config.py)
    "pypdfium2>=4.0.0",         # PDF rendering
    "Pillow>=10.0.0",           # page images
    "PyMuPDF>=1.23.0",          # PDF splitting for Mistral (max 30 pages/request)
    "requests>=2.31.0",         # OCR APIs, Transkribus upload
    "lxml>=4.9.0",              # TEI/XML, RelaxNG
    "rapidfuzz>=3.0.0",         # Levenshtein opcodes (CER decomposition)
    "numpy>=1.26.0",            # CER statistics (bootstrap)
    "scipy>=1.11.0",            # CER statistics (tests/distributions)
    "pyspellchecker>=0.7.0",    # quality proxy (dictionary hit rate)
    "openpyxl>=3.1",            # Masterfile.xlsx (scripts/eval/corpus_audit.py)
    "anthropic>=0.39.0",        # LLM post-correction (stage 2a, lazy import)
    "google-genai>=1.0.0",      # Gemini (layout QA, classification, OCR correction, TEI step 2)
]

[project.optional-dependencies]
# Heavy engines, lazily imported and not needed by the pipeline gates: torch for the
# local GPU experiments in scripts/utils.py, Docling for the local layout engine
# (needs Windows Developer Mode for symlinks).
layout = ["torch", "docling", "docling[easyocr]"]
# Quality gate. Ruff is pinned so the pre-commit hook and CI report the same findings.
dev = ["pytest>=7.0.0", "ruff==0.16.2", "pyyaml>=6.0"]  # pyyaml: tests/test_knowledge_frontmatter.py

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]  # line length is the formatter's business
# Deliberately inactive: D (docstring prose stays free), TRY/EM/BLE (the pipeline's
# skip-and-log-and-collect error style would fight them), ANN not enabled globally.

[tool.ruff.lint.per-file-ignores]
# The stopword blocks are written as `"""...""".split()`; SIM905 would turn the
# word lists into hundreds of quoted items.
"scripts/entity/entity_unlisted_scan.py" = ["SIM905"]

# RUF001: the ambiguous characters are the domain data of the character
# normalization (hyphen and dash classes, no-break space variants, the apostrophe
# target U+2019) and their test fixtures. Replacing them would delete the subject.
"scripts/eval/cer_statistics.py" = ["RUF001"]
"scripts/eval/char_lint_audit.py" = ["RUF001"]
"scripts/tei/tei_char_normalize.py" = ["RUF001"]
"tests/test_cer_extraction.py" = ["RUF001"]
"tests/test_cer_statistics.py" = ["RUF001"]
"tests/test_char_lint_audit.py" = ["RUF001"]
"tests/test_char_normalize.py" = ["RUF001"]
"tests/test_reading_order_fix.py" = ["RUF001"]
"tests/test_running_head_audit.py" = ["RUF001"]

# RUF003: the comments name the characters the mapping table maps.
"scripts/eval/evaluate_ocr.py" = ["RUF003"]
"scripts/core/tei_xml_utils.py" = ["RUF003"]

# E402: a warning filter or an environment variable has to be set before the
# heavy SDK import that reads it.
"scripts/ocr/gemini_ocr_correct.py" = ["E402"]
"scripts/layout/layout_qa_gemini.py" = ["E402"]
"scripts/layout/run_layout_analysis.py" = ["E402"]

[tool.ruff.lint.isort]
# Keeps re-exports (`X as X`) inside their parenthesized block instead of one
# import statement per aliased name.
combine-as-imports = true

[tool.pytest.ini_options]
# Markers are registered in tests/conftest.py; a misspelled marker must fail, not deselect.
addopts = "--strict-markers"
